name: Test, Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-application:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
        run: npm test

  build-application:
    name: Build application
    runs-on: ubuntu-latest
    needs: test-application
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-application:
    name: Deploy application
    runs-on: ubuntu-latest
    needs:
      - test-application
      - build-application
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: https://dfa-hosptal-appoinment-application.onrender.com
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Add the Render deploy hook URL as the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered for [$RENDER_SERVICE_URL]($RENDER_SERVICE_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check deployed backend health
        env:
          RENDER_SERVICE_URL: https://dfa-hosptal-appoinment-application.onrender.com
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$RENDER_SERVICE_URL/api/health"
